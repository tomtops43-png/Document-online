<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENC Document Center</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ENC QMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-bar">
  <div class="app-title">🏭 ENC (H9) — Document Center</div>
</header>

<main class="container container-wide">

  <!-- ปุ่มย้อนกลับ + breadcrumb -->
  <div class="nav-row">
    <button type="button" id="btn-back" class="btn-nav-back"><span class="back-arrow">◀</span> ย้อนกลับ</button>
    <div class="crumbs" id="crumbs"></div>
  </div>

  <!-- Hero: ภาพรวมโรงงาน (แสดงเฉพาะขั้นเลือกไลน์) -->
  <div id="dash-hero" class="dash-hero" style="display:none">
    <div class="dash-hero-title">🏭 ENC (H9)</div>
    <p class="dash-hero-sub">ระบบบริหารเอกสารคุณภาพและการตรวจสอบ — เลือกไลน์เพื่อเริ่มต้น</p>
    <div class="dash-hero-stats" id="hero-stats"></div>
  </div>

  <!-- การ์ดสรุปงานของฉัน -->
  <section id="my-work" class="dash-cards" style="display:none"></section>

  <!-- ขั้น 1: เลือกไลน์ -->
  <section id="step-line" class="card" style="display:none">
    <div class="section-heading"><h2>เลือกไลน์ผลิต</h2></div>
    <div id="line-list" class="big-choice-list"></div>
  </section>

  <!-- ขั้น 2: เลือกหมวดเอกสาร (First Piece / OK 1st Part / ...) -->
  <section id="step-category" class="card" style="display:none">
    <div class="section-heading"><h2 id="category-title">เลือกหมวดเอกสาร</h2></div>
    <div id="category-grid" class="big-choice-list"></div>
  </section>

  <!-- ขั้น 3: เลือกรุ่นหลัก (Family) — แสดงเฉพาะถ้าหมวดนี้มีมากกว่า 1 รุ่น -->
  <section id="step-family" class="card" style="display:none">
    <div class="section-heading"><h2 id="family-title">เลือกรุ่นหลัก (Family)</h2></div>
    <div id="family-grid" class="big-choice-list"></div>
  </section>

  <!-- ขั้น 4: เลือกซีรีส์ (Series) — แสดงเฉพาะถ้ารุ่นหลักนี้มีมากกว่า 1 ซีรีส์ (เช่น LC แยก Classic/Visi Smart) -->
  <section id="step-series" class="card" style="display:none">
    <div class="section-heading"><h2 id="series-title">เลือกซีรีส์</h2></div>
    <div id="series-grid" class="big-choice-list"></div>
  </section>

  <!-- ขั้น 5: เลือก Station (ข้ามถ้าเป็น First Piece — 1 ไฟล์ครอบคลุมทุก Station) -->
  <section id="step-station" class="card" style="display:none">
    <div class="section-heading"><h2 id="station-title">เลือก Station</h2></div>
    <div id="station-grid" class="big-choice-list station-grid"></div>
  </section>

  <!-- ขั้น 6: Document Center -->
  <section id="step-docs" style="display:none">
    <div class="card">
      <div class="section-heading">
        <h2 id="docs-title"></h2>
        <span class="count-pill" id="docs-count"></span>
      </div>
      <div id="doc-list"></div>
    </div>
  </section>

</main>

<!-- Modal: กรอก header ก่อนเริ่มกรอกฟอร์ม -->
<div id="header-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="header-modal-title"></h3>
      <button type="button" class="btn-small" onclick="closeHeaderModal()">✕</button>
    </div>
    <div id="header-modal-fields"></div>
    <button type="button" class="btn-primary btn-block" id="btn-start-fill">เริ่มกรอกฟอร์ม ▶</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/master.js"></script>
<script src="js/shell.js"></script>
<script>
const user = Auth.requireLogin();
AppShell.init('dashboard');

// state การนำทาง: ?line=L4&cat=first-piece&family=NLC&series=Classic&station=L4-ST12
// ลำดับ: ENC > ไลน์ > หมวดเอกสาร > รุ่นหลัก (Family — ข้ามถ้าหมวดนี้มีรุ่นเดียว) >
//        ซีรีส์ (Series — ข้ามถ้ารุ่นหลักนี้มีซีรีส์เดียว) > Station (ข้ามถ้าเป็น First Piece) > เอกสาร
let curLine = null, curCat = null, curFamily = null, curSeries = null, curStation = null;

function nav(line, cat, family, series, station) {
  const p = new URLSearchParams();
  if (line) p.set('line', line);
  if (cat) p.set('cat', cat);
  if (family) p.set('family', family);
  if (series) p.set('series', series);
  if (station) p.set('station', station);
  history.pushState({}, '', 'dashboard.html' + (p.toString() ? '?' + p.toString() : ''));
  render();
}
window.addEventListener('popstate', render);
document.addEventListener('master-updated', render);

// ปุ่มย้อนกลับ: ถอยขึ้นไปทีละขั้น (Station → ซีรีส์ → รุ่นหลัก → หมวดเอกสาร → ไลน์ → ENC)
document.getElementById('btn-back').addEventListener('click', function () {
  if (curStation) { nav(curLine, curCat, curFamily, curSeries); return; }
  if (curSeries) { nav(curLine, curCat, curFamily); return; }
  if (curFamily) { nav(curLine, curCat); return; }
  if (curCat) { nav(curLine); return; }
  if (curLine) { nav(); return; }
});

// เอกสารทั้งหมดของไลน์ที่อยู่ในหมวด (category) นี้
function docsInCategory(cat) {
  return Master.documentsForLine(curLine).filter(cat.match);
}

// จัดเอกสารในหมวดเป็นกลุ่มตามรุ่นหลัก — เอกสารที่ family_id เป็น '*' หรือไม่ระบุ จัดเข้ากลุ่ม "ทุกรุ่น / ไม่ระบุ"
function familyBuckets(cat) {
  const docs = docsInCategory(cat);
  const map = {};
  docs.forEach(function (d) {
    const fid = (d.family_id && d.family_id !== '*') ? d.family_id : '_ALL';
    (map[fid] = map[fid] || []).push(d);
  });
  const buckets = [];
  Master.families().forEach(function (f) {
    if (map[f.family_id]) buckets.push({ family_id: f.family_id, label: f.display_name, docs: map[f.family_id] });
  });
  if (map['_ALL']) buckets.push({ family_id: '_ALL', label: 'ทุกรุ่น / ไม่ระบุ', docs: map['_ALL'] });
  return buckets;
}

function familyMatch(d) {
  if (!curFamily) return true;
  if (curFamily === '_ALL') return !d.family_id || d.family_id === '*';
  return d.family_id === curFamily;
}

// จัดเอกสารในรุ่นหลัก (family) นี้เป็นกลุ่มตามซีรีส์ย่อย (series_tag) — เช่น Family "LC" แยกเป็น Classic / Visi Smart
// เอกสารที่ไม่ได้ระบุ series_tag จัดเข้ากลุ่ม "ไม่ระบุซีรีส์"
function seriesBuckets(cat) {
  const docs = docsInCategory(cat).filter(familyMatch);
  const map = {};
  const order = [];
  docs.forEach(function (d) {
    const tag = d.series_tag || '_NONE';
    if (!map[tag]) { map[tag] = []; order.push(tag); }
    map[tag].push(d);
  });
  const buckets = order.filter(function (t) { return t !== '_NONE'; }).sort().map(function (t) {
    return { series_tag: t, label: t, docs: map[t] };
  });
  if (map['_NONE']) buckets.push({ series_tag: '_NONE', label: 'ไม่ระบุซีรีส์', docs: map['_NONE'] });
  return buckets;
}

function seriesMatch(d) {
  if (!curSeries) return true;
  if (curSeries === '_NONE') return !d.series_tag;
  return d.series_tag === curSeries;
}

function crumbs() {
  const el = document.getElementById('crumbs');
  let html = '<a href="#" onclick="nav();return false">ENC</a>';
  if (curLine) {
    const l = Master.line(curLine);
    const lineLabel = l ? l.display_name : curLine;
    html += ' › ' + ((curCat)
      ? '<a href="#" onclick="nav(\'' + curLine + '\');return false">' + lineLabel + '</a>'
      : '<b>' + lineLabel + '</b>');
  }
  if (curCat) {
    const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; });
    const catLabel = (cat ? cat.icon + ' ' + cat.label : curCat);
    html += ' › ' + ((curFamily || curStation)
      ? '<a href="#" onclick="nav(\'' + curLine + '\',\'' + curCat + '\');return false">' + catLabel + '</a>'
      : '<b>' + catLabel + '</b>');
  }
  if (curFamily) {
    const buckets = familyBuckets(DOC_CATEGORIES.find(function (c) { return c.key === curCat; }) || {});
    const bucket = buckets.find(function (b) { return b.family_id === curFamily; });
    const famLabel = bucket ? bucket.label : curFamily;
    html += ' › ' + ((curSeries || curStation)
      ? '<a href="#" onclick="nav(\'' + curLine + '\',\'' + curCat + '\',\'' + curFamily + '\');return false">' + famLabel + '</a>'
      : '<b>' + famLabel + '</b>');
  }
  if (curSeries) {
    const buckets = seriesBuckets(DOC_CATEGORIES.find(function (c) { return c.key === curCat; }) || {});
    const bucket = buckets.find(function (b) { return b.series_tag === curSeries; });
    const serLabel = bucket ? bucket.label : curSeries;
    html += ' › ' + (curStation
      ? '<a href="#" onclick="nav(\'' + curLine + '\',\'' + curCat + '\',\'' + curFamily + '\',\'' + curSeries + '\');return false">' + serLabel + '</a>'
      : '<b>' + serLabel + '</b>');
  }
  if (curStation) {
    const s = Master.station(curStation);
    html += ' › <b>' + (s ? 'Station ' + s.station_no : curStation) + '</b>';
  }
  el.innerHTML = html;
}

async function render() {
  const p = new URLSearchParams(location.search);
  curLine = p.get('line');
  curCat = p.get('cat');
  curFamily = p.get('family');
  curSeries = p.get('series');
  curStation = p.get('station');
  await Master.load();
  crumbs();
  document.getElementById('btn-back').style.display = curLine ? 'inline-flex' : 'none';

  let step;
  if (!curLine) step = 'step-line';
  else if (!curCat) step = 'step-category';
  else {
    const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; }) || DOC_CATEGORIES[DOC_CATEGORIES.length - 1];
    const needsFamily = familyBuckets(cat).length >= 2;
    if (needsFamily && !curFamily) step = 'step-family';
    else if (seriesBuckets(cat).length >= 2 && !curSeries) step = 'step-series';
    else if (curCat !== 'first-piece' && !curStation) step = 'step-station'; // First Piece: 1 ไฟล์ครอบคลุมทุก Station — ข้ามขั้นนี้
    else step = 'step-docs';
  }

  show(step);
  if (step === 'step-docs') renderDocs();
  else if (step === 'step-station') renderStations();
  else if (step === 'step-series') renderSeries();
  else if (step === 'step-family') renderFamilies();
  else if (step === 'step-category') renderCategories();
  else renderLines();
}

function show(id) {
  ['step-line', 'step-category', 'step-family', 'step-series', 'step-station', 'step-docs'].forEach(function (s) {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
  document.getElementById('my-work').style.display = id === 'step-line' ? 'grid' : 'none';
  if (id !== 'step-line') document.getElementById('dash-hero').style.display = 'none';
}

// ---------- ขั้น 1: ไลน์ ----------
function renderLines() {
  const el = document.getElementById('line-list');
  el.innerHTML = '';
  let totalStations = 0, totalDocs = 0;
  Master.lines().forEach(function (l) {
    const n = Master.stations(l.line_id).length;
    totalStations += n;
    const btn = document.createElement('button');
    btn.className = 'btn-choice';
    btn.innerHTML = '<b>' + l.display_name + '</b><br><small>' + n + ' Station</small>';
    btn.addEventListener('click', function () { nav(l.line_id); });
    el.appendChild(btn);
  });
  totalDocs = (Master.data.M_Document || []).length;
  document.getElementById('dash-hero').style.display = 'block';
  document.getElementById('hero-stats').innerHTML =
    '<div class="dash-stat"><b>' + Master.lines().length + '</b><span>ไลน์ผลิต</span></div>' +
    '<div class="dash-stat"><b>' + totalStations + '</b><span>Station ทั้งหมด</span></div>' +
    '<div class="dash-stat"><b>' + totalDocs + '</b><span>เอกสารในระบบ</span></div>';
  renderMyWork();
}

// การ์ดสรุปงานของฉัน (คิวอนุมัติ)
async function renderMyWork() {
  const el = document.getElementById('my-work');
  el.innerHTML = '';
  const isApprover = user.role === 'Leader' || user.role === 'QI' || user.role === 'Admin';
  if (!isApprover) return;
  const status = user.role === 'QI' ? 'PENDING_QI' : (user.role === 'Leader' ? 'PENDING_LEADER' : '');
  try {
    const res = await API.get('getRecords', { status: status });
    let records = res.records || [];
    if (user.role === 'Admin') {
      records = records.filter(function (r) {
        return r.status === 'PENDING_LEADER' || r.status === 'PENDING_QI';
      });
    }
    const n = records.length;
    if (n > 0) {
      el.innerHTML = '<a class="dash-card dash-warn" href="records.html">⏳ รออนุมัติจากคุณ <b>' + n + '</b> รายการ — กดเพื่อไปอนุมัติ</a>';
    }
  } catch (e) { /* เงียบ — dashboard ต้องเปิดได้แม้ API ล่ม */ }
}

// ---------- ขั้น 2: หมวดเอกสาร ----------
function renderCategories() {
  const l = Master.line(curLine);
  document.getElementById('category-title').textContent = 'เลือกหมวดเอกสาร — ' + (l ? l.display_name : curLine);
  const el = document.getElementById('category-grid');
  el.innerHTML = '';

  const assigned = new Set();
  DOC_CATEGORIES.forEach(function (cat) {
    const n = docsInCategory(cat).filter(function (d) {
      if (assigned.has(d.doc_id)) return false;
      assigned.add(d.doc_id);
      return true;
    }).length;
    if (!n) return;
    const btn = document.createElement('button');
    btn.className = 'btn-choice btn-doc-category';
    btn.innerHTML = '<span class="cat-icon-lg">' + cat.icon + '</span><b>' + cat.label + '</b><br><small>' + n + ' เอกสาร</small>';
    btn.addEventListener('click', function () { nav(curLine, cat.key); });
    el.appendChild(btn);
  });

  if (!el.children.length) {
    el.innerHTML = '<div class="empty-hint">ยังไม่มีเอกสารในไลน์นี้ — Admin เพิ่มได้ที่หน้าจัดการเอกสาร Master</div>';
  }
}

// ---------- ขั้น 3: รุ่นหลัก (Family) — แสดงเฉพาะถ้าหมวดนี้มีมากกว่า 1 รุ่น ----------
function renderFamilies() {
  const l = Master.line(curLine);
  const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; });
  document.getElementById('family-title').textContent =
    'เลือกรุ่นหลัก — ' + (l ? l.display_name : curLine) + (cat ? ' / ' + cat.icon + ' ' + cat.label : '');
  const el = document.getElementById('family-grid');
  el.innerHTML = '';
  familyBuckets(cat).forEach(function (b) {
    const btn = document.createElement('button');
    btn.className = 'btn-choice';
    btn.innerHTML = '<b>' + b.label + '</b><br><small>' + b.docs.length + ' เอกสาร</small>';
    btn.addEventListener('click', function () { nav(curLine, curCat, b.family_id); });
    el.appendChild(btn);
  });
}

// ---------- ขั้น 4: ซีรีส์ (Series) — แสดงเฉพาะถ้ารุ่นหลักนี้มีมากกว่า 1 ซีรีส์ ----------
function renderSeries() {
  const l = Master.line(curLine);
  const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; });
  const famBucket = familyBuckets(cat).find(function (b) { return b.family_id === curFamily; });
  document.getElementById('series-title').textContent =
    'เลือกซีรีส์ — ' + (l ? l.display_name : curLine) + (cat ? ' / ' + cat.icon + ' ' + cat.label : '') +
    (famBucket ? ' / ' + famBucket.label : '');
  const el = document.getElementById('series-grid');
  el.innerHTML = '';
  seriesBuckets(cat).forEach(function (b) {
    const btn = document.createElement('button');
    btn.className = 'btn-choice';
    btn.innerHTML = '<b>' + b.label + '</b><br><small>' + b.docs.length + ' เอกสาร</small>';
    btn.addEventListener('click', function () { nav(curLine, curCat, curFamily, b.series_tag); });
    el.appendChild(btn);
  });
}

// ---------- ขั้น 5: Station (ข้ามถ้าเป็น First Piece) ----------
function renderStations() {
  const l = Master.line(curLine);
  const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; });
  document.getElementById('station-title').textContent =
    'เลือก Station — ' + (l ? l.display_name : curLine) + (cat ? ' / ' + cat.icon + ' ' + cat.label : '');
  const el = document.getElementById('station-grid');
  el.innerHTML = '';
  Master.stations(curLine).forEach(function (s) {
    const docs = Master.documentsForStation(s.station_id, curLine)
      .filter(cat ? cat.match : function () { return true; })
      .filter(familyMatch)
      .filter(seriesMatch);
    const btn = document.createElement('button');
    btn.className = 'btn-choice btn-station';
    btn.innerHTML = '<span class="station-num">' + s.station_no + '</span>' +
      '<span class="station-name">Station ' + s.station_no + '</span>' +
      '<small>' + docs.length + ' เอกสาร</small>';
    btn.addEventListener('click', function () { nav(curLine, curCat, curFamily, curSeries, s.station_id); });
    el.appendChild(btn);
  });
}

// ---------- ขั้น 6: Document Center ----------
function renderDocs() {
  const l = Master.line(curLine);
  const s = curStation ? Master.station(curStation) : null;
  const cat = DOC_CATEGORIES.find(function (c) { return c.key === curCat; }) ||
    { label: 'เอกสาร', icon: '📂', match: function () { return true; } };

  const familyLabel = (function () {
    if (!curFamily) return '';
    const bucket = familyBuckets(cat).find(function (b) { return b.family_id === curFamily; });
    return bucket ? ' / ' + bucket.label : '';
  })();
  const seriesLabel = (function () {
    if (!curSeries) return '';
    const bucket = seriesBuckets(cat).find(function (b) { return b.series_tag === curSeries; });
    return bucket ? ' / ' + bucket.label : '';
  })();

  document.getElementById('docs-title').textContent =
    cat.icon + ' ' + (l ? l.display_name : '') + familyLabel + seriesLabel + (s ? ' / Station ' + s.station_no : '') + ' — ' + cat.label;

  const allDocs = curStation ? Master.documentsForStation(curStation, curLine) : Master.documentsForLine(curLine);
  const docs = allDocs.filter(cat.match).filter(familyMatch).filter(seriesMatch);
  const el = document.getElementById('doc-list');
  document.getElementById('docs-count').textContent = docs.length + ' เอกสาร';

  if (!docs.length) {
    el.innerHTML = '<div class="empty-hint">ยังไม่มีเอกสารในหมวดนี้ — Admin เพิ่มได้ที่หน้าจัดการเอกสาร Master</div>';
    return;
  }

  el.innerHTML = '';
  const byType = {};
  docs.forEach(function (d) { (byType[d.doctype_id] = byType[d.doctype_id] || []).push(d); });
  Master.docTypes().forEach(function (t) {
    const list = byType[t.doctype_id];
    if (!list) return;
    list.forEach(function (d) { el.appendChild(docCard(d, t)); });
  });
}

const DOC_CATEGORIES = [
  { key: 'first-piece', label: 'First Piece', icon: '🔍', match: function (d) { return d.doctype_id === 'first-piece'; } },
  { key: 'ok-1st-part', label: 'OK 1st Part', icon: '✅', match: function (d) { return d.doctype_id === 'ok-1st-part'; } },
  { key: 'other-form', label: 'แบบฟอร์มอื่นๆ', icon: '📋', match: function (d) { return d.doctype && d.doctype.behavior === 'form'; } },
  { key: 'master', label: 'Master / เอกสารอ้างอิง', icon: '📚', match: function (d) { return d.doctype && d.doctype.behavior === 'file'; } },
  { key: 'recovery', label: 'แผนแก้ไข', icon: '🔧', match: function (d) { return d.doctype && d.doctype.behavior === 'recovery'; } },
  { key: 'other', label: 'อื่นๆ', icon: '📄', match: function () { return true; } }
];

const BEHAVIOR_LABEL = { form: 'กรอก/ตรวจสอบ', file: 'เอกสารอ้างอิง', recovery: 'แผนแก้ไข' };

function docCard(d, t) {
  const card = document.createElement('div');
  card.className = 'doc-card';
  card.dataset.behavior = t.behavior;
  const rev = d.current_rev;
  let meta = (d.doc_no ? 'เลขที่: ' + d.doc_no + ' | ' : '') +
    (rev ? 'Revision: ' + rev.rev_no + (rev.effective_date ? ' (มีผล ' + rev.effective_date + ')' : '') : 'ยังไม่มี revision');
  let buttons = '';

  if (t.behavior === 'form') {
    buttons = '<button type="button" class="btn-primary" data-act="fill">✏️ กรอก</button>';
  } else if (t.behavior === 'file') {
    buttons = '<a class="btn-primary" href="viewer.html?doc_id=' + encodeURIComponent(d.doc_id) + '">📖 เปิดดู</a>';
  } else if (t.behavior === 'recovery') {
    buttons = '<button type="button" class="btn-secondary" disabled>🔧 เปิดใช้ใน Step ถัดไป</button>';
  }

  card.innerHTML =
    '<div class="doc-icon">' + (t.icon || '📄') + '</div>' +
    '<div class="doc-info">' +
    '<span class="doc-behavior-tag">' + (BEHAVIOR_LABEL[t.behavior] || t.behavior) + '</span>' +
    '<div class="doc-name">' + d.doc_name + '</div>' +
    '<div class="doc-meta">' + meta + '</div></div>' +
    '<div class="doc-actions">' + buttons + '</div>';

  const fillBtn = card.querySelector('[data-act="fill"]');
  if (fillBtn) fillBtn.addEventListener('click', function () { openHeaderModal(d); });
  return card;
}

function stationNo() {
  const s = Master.station(curStation);
  return s ? s.station_no : '';
}

// ---------- เริ่มกรอกฟอร์ม: โหลด template → กรอก header → ไป fill.html ----------
let pendingDoc = null, pendingTemplate = null;

async function openHeaderModal(d) {
  if (!d.current_rev || !/\.json$/.test(String(d.current_rev.content_ref))) {
    showToast('เอกสารนี้ยังไม่มี template revision ที่ใช้กรอกได้', 'error');
    return;
  }
  Loading.show('กำลังโหลดฟอร์ม...');
  try {
    pendingTemplate = await loadTemplate(null, d.current_rev.content_ref);
    pendingDoc = d;
  } catch (err) {
    Loading.hide();
    showToast(err.message, 'error');
    return;
  }
  Loading.hide();
  document.getElementById('header-modal-title').textContent = d.doc_name;
  const fieldsEl = document.getElementById('header-modal-fields');
  const today = new Date().toISOString().slice(0, 10);
  let html = '<div class="selected-station">' +
    (curStation ? 'Station: <b>' + stationNo() + '</b> | ' : '') +
    (Master.line(curLine) || {}).display_name + '</div>';
  const modelOptions = pendingDoc.family_id && pendingDoc.family_id !== '*'
    ? Master.models(pendingDoc.family_id, pendingDoc.series_tag, pendingDoc.model_group) : [];
  (pendingTemplate.header_fields || []).forEach(function (f) {
    if (f.key === 'time') return;
    html += '<label class="field"><span>' + f.label + (f.required ? ' *' : '') + '</span>';
    if (f.key === 'product_model' && modelOptions.length) {
      // มีรุ่นย่อยของ Family นี้ในชีท M_Model แล้ว — เปลี่ยนเป็น dropdown กันพิมพ์ผิด
      // แต่ถ้ารุ่นที่ต้องการยังไม่มีในลิสต์ (ยังไม่ได้เพิ่มใน M_Model) ให้เลือก "อื่นๆ" แล้วพิมพ์เองได้ —
      // ค่าที่พิมพ์เองจะถูก flag ด้วย ⚠️ ให้แอดมินเห็นตอนไปเพิ่มรุ่นจริงใน M_Model ทีหลัง
      html += '<select data-hk="' + f.key + '"><option value="">— เลือกรุ่น —</option>' +
        modelOptions.map(function (m) { return '<option>' + m.model_name + '</option>'; }).join('') +
        '<option value="__other__">➕ อื่นๆ / พิมพ์เอง (รุ่นยังไม่มีในลิสต์)</option></select>' +
        '<input type="text" data-hk-other="' + f.key + '" placeholder="พิมพ์ชื่อรุ่น..." style="display:none;margin-top:6px">';
    } else if (f.type === 'select') {
      html += '<select data-hk="' + f.key + '"><option value="">— เลือก —</option>' +
        f.options.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'date') {
      html += '<input type="date" data-hk="' + f.key + '" value="' + today + '">';
    } else if (f.key === 'line') {
      html += '<input type="text" data-hk="' + f.key + '" value="' + ((Master.line(curLine) || {}).line_name || f.default || '') + '">';
    } else {
      html += '<input type="text" data-hk="' + f.key + '" value="' + (f.default || '') + '">';
    }
    html += '</label>';
  });
  fieldsEl.innerHTML = html;
  // toggle ช่องพิมพ์เองเมื่อเลือก "อื่นๆ" ใน dropdown รุ่น
  fieldsEl.querySelectorAll('select[data-hk]').forEach(function (sel) {
    const other = fieldsEl.querySelector('[data-hk-other="' + sel.dataset.hk + '"]');
    if (!other) return;
    sel.addEventListener('change', function () {
      if (sel.value === '__other__') {
        other.style.display = '';
        other.focus();
      } else {
        other.style.display = 'none';
        other.value = '';
      }
    });
  });
  document.getElementById('header-modal').style.display = 'flex';
}

function closeHeaderModal() {
  document.getElementById('header-modal').style.display = 'none';
}

// Click outside to close modal
document.getElementById('header-modal').addEventListener('click', function (e) {
  if (e.target === this) {
    closeHeaderModal();
  }
});

document.getElementById('btn-start-fill').addEventListener('click', function () {
  const header = {};
  let missing = null;
  document.querySelectorAll('#header-modal-fields [data-hk]').forEach(function (i) {
    header[i.dataset.hk] = i.value.trim();
  });
  // ถ้าเลือก "อื่นๆ" ในรุ่นสินค้า ให้ใช้ค่าที่พิมพ์เองแทน พร้อม flag ⚠️ ให้แอดมินเห็นว่าต้องไปเพิ่มใน M_Model
  document.querySelectorAll('#header-modal-fields [data-hk-other]').forEach(function (i) {
    if (i.style.display === 'none') return;
    const key = i.dataset.hkOther;
    const typed = i.value.trim();
    header[key] = typed ? ('⚠️ ' + typed + ' (รอเพิ่มใน master)') : '';
  });
  (pendingTemplate.header_fields || []).forEach(function (f) {
    if (f.key === 'time') return;
    if (f.required && !header[f.key]) missing = missing || f.label;
  });
  if (missing) { showToast('กรุณากรอก: ' + missing, 'error'); return; }
  sessionStorage.setItem('fp_fill_context', JSON.stringify({
    form_id: pendingTemplate.form_id,
    template_file: pendingDoc.current_rev.content_ref,
    doc_id: pendingDoc.doc_id,
    doctype_id: pendingDoc.doctype_id,
    station: pendingTemplate.mode === 'log-sheet' ? stationNo() : null,
    // กรอกเสร็จแล้วให้กลับมาหน้านี้ ณ ไลน์/หมวด/Station เดิม (URL มี query ครบอยู่แล้วจาก pushState)
    // ไม่ใช่เด้งไปหน้าแรกแล้วต้องไล่เลือกไลน์→Station ใหม่ทุกใบ
    return_url: location.href,
    header: header
  }));
  location.href = 'fill.html';
});

// ---------- เริ่มต้น ----------
Loading.show('กำลังโหลดข้อมูลโรงงาน...');
render().catch(function (err) {
  document.getElementById('step-line').style.display = 'block';
  document.getElementById('line-list').innerHTML =
    '<div class="empty-hint">โหลด Master Data ไม่สำเร็จ: ' + err.message +
    '<br>ตรวจว่า Deploy GAS เวอร์ชันล่าสุด และรัน setupMasterSheets + seedMaster แล้ว</div>';
}).finally(function () { Loading.hide(); });
</script>
