<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENC Manufacturing QMS — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .login-shell {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; background: radial-gradient(circle at 20% 0%, #16324d 0%, var(--ink-900) 55%, #081522 100%);
  }
  .login-brand { text-align: center; color: #fff; margin-bottom: 22px; }
  .login-logo {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    box-shadow: 0 8px 22px rgba(43,125,233,.4);
  }
  .login-brand h1 { font-size: 22px; margin: 0 0 4px; font-weight: 800; letter-spacing: .3px; }
  .login-brand p { margin: 0; font-size: 14px; opacity: .7; }
  .login-card { width: 100%; max-width: 380px; }
</style>
</head>
<body class="login-body">

<main class="login-shell" id="login-shell">
  <div class="login-brand">
    <div class="login-logo">🏭</div>
    <h1>ENC Manufacturing QMS</h1>
    <p>ระบบบริหารเอกสารคุณภาพและการตรวจสอบ — ไลน์ ENC (H9)</p>
  </div>

  <section id="step-login" class="card login-card">
    <h2>เข้าสู่ระบบ</h2>
    <label class="field">
      <span>รหัสพนักงาน</span>
      <input type="text" id="login-employee-id" inputmode="numeric" autocomplete="username">
    </label>
    <label class="field">
      <span>PIN</span>
      <input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password">
    </label>
    <button type="button" class="btn-primary btn-block" id="btn-login">เข้าสู่ระบบ</button>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('btn-login').addEventListener('click', async function () {
  const empId = document.getElementById('login-employee-id').value.trim();
  const pin = document.getElementById('login-pin').value.trim();
  if (!empId || !pin) { showToast('กรุณากรอกรหัสพนักงานและ PIN', 'error'); return; }
  Loading.show('กำลังเข้าสู่ระบบ...');
  try {
    await Auth.login(empId, pin);
    location.href = 'home.html';
  } catch (err) {
    Loading.hide();
    showToast('เข้าสู่ระบบไม่สำเร็จ: ' + err.message, 'error');
  }
});
document.getElementById('login-pin').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});

if (Auth.isLoggedIn()) location.href = 'home.html';
</script>
</body>
</html>
